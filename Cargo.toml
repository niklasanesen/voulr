[package]
name = "voulr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["original-uri"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bb8 = "0.9.1"
dotenvy = "0.15.7"
oauth2 = "5.0.0"
redis = { version = "1.8.2", default-features = false, features = ["tokio-rustls-comp", "bb8", "tls-rustls-webpki-roots", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }
