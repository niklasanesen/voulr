<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>login | voulr</title>
    <meta name="description" content="log in or register to voulr" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />

    <link href="styles/output.css" rel="stylesheet" />
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <div class="mx-auto max-w-xl px-6">
      <header class="pt-20 ml-6 mb-6">
        <a href="index.html" class="block w-fit">
          <img src="assets/logomark.svg" alt="voulr" />
        </a>
      </header>
      <main class="border rounded-3xl flex flex-col gap-3 p-6 bg-neutral-950">
        <div class="flex flex-col gap-1 text-center">
          <h1 class="text-xl">log in or register</h1>
          <p class="text-neutral-400 text-pretty">

          </p>
        </div>
        <div class="flex flex-col gap-3">
          <a href="/auth/google" data-app class="btn btn-border btn-xl">
            <img src="assets/google.svg" alt="google" />
            continue with google
          </a>
          <a href="/auth/github" data-app class="btn btn-border btn-xl">
            <img src="assets/github.svg" alt="github" />
            continue with github
          </a>
        </div>
        <a href="#" class="self-center text-neutral-500 underline">
          privacy & terms
        </a>
      </main>
    </div>
